[project]
name = "lociighostd"
version = "1.0.0"
description = "LociiGhost iOS location simulation daemon"
requires-python = ">=3.13"
dependencies = [
    "pymobiledevice3>=9.9.0",
    "httpx>=0.27.0",
    "gpxpy>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
lociighostd = "lociighostd.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lociighostd*"]
